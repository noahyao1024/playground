name: Check

# Typecheck, lint and the tests, on every pull request and every push to main.
# Agents may merge their own pull requests without asking (see AGENTS.md), and
# this is what that trust rests on: nothing is merged while it is red.
#
# The database tests need a real Postgres, so the job runs one beside it. Its
# password is a throwaway for that container, not a secret. Nothing here talks
# to Supabase or Vercel, which is also what makes it safe to run on a pull
# request from a fork.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
