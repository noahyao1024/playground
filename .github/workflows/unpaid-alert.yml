name: Unpaid Alert

# Flags anyone owing more than the threshold.
#
# Reports three ways, in increasing order of how much setup they need:
#
#   run summary  always, readable in the Actions tab
#   issue        always, using the built-in token — GitHub notifies you for free,
#                and the phone app pushes it
#   email        only when SMTP secrets exist, skipped silently otherwise
#
# The issue is reused rather than reopened each week, so a standing debt is one
# thread that updates, not an inbox full of duplicates. It closes itself when
# everyone drops back under the threshold.
#
# These summaries are public, as the repository is. That is its owner's call.

on:
  schedule:
    - cron: '23 1 * * 1' # Mondays, off-the-hour to dodge Actions cron congestion
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's `if` cannot read env declared on itself.
    permissions:
      issues: write
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
    steps:
      - name: Find who is over the threshold
        id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          THRESHOLD: ${{ vars.UNPAID_THRESHOLD_CNY || '500' }}
        run: |
          set -euo pipefail

          # Shape only — the value itself stays masked. Enough to tell a stray
          # quote or scheme from a whitespace problem if this ever breaks again.
          printf 'url: len=%s first=%s colons=%s\n' \
            "${#SUPABASE_URL}" "$(printf '%.1s' "$SUPABASE_URL")" \
            "$(printf '%s' "$SUPABASE_URL" | tr -cd ':' | wc -c)"

          curl --fail -sS -o charges.json \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/charges?select=subscriber_id,total_cny,period_start,paid,deleted_at&paid=eq.false&deleted_at=is.null"
          curl --fail -sS -o people.json \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/subscribers?select=id,name"

          python3 - <<'PY'
          import json, os, collections

          threshold = float(os.environ["THRESHOLD"])
          charges = json.load(open("charges.json"))
          names = {p["id"]: p["name"] for p in json.load(open("people.json"))}

          owed = collections.defaultdict(float)
          count = collections.Counter()
          oldest = {}
          for c in charges:
              sid = c["subscriber_id"]
              owed[sid] += float(c["total_cny"])
              count[sid] += 1
              p = c["period_start"]
              if sid not in oldest or p < oldest[sid]:
                  oldest[sid] = p

          over = sorted(
              ((names.get(s, s), owed[s], count[s], oldest[s]) for s in owed if owed[s] > threshold),
              key=lambda r: -r[1],
          )

          print(f"over threshold: {len(over)}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"count={len(over)}\n")

          # The run summary, so the alert is readable with no email configured.
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              if not over:
                  fh.write(f"Nobody owes more than ¥{threshold:,.0f}.\n")
              else:
                  fh.write(f"## {len(over)} over ¥{threshold:,.0f}\n\n")
                  fh.write("| Person | Owed | Charges | Oldest |\n|---|---:|---:|---|\n")
                  for name, total, n, first in over:
                      fh.write(f"| {name} | ¥{total:,.2f} | {n} | {first} |\n")
                  fh.write("\n[Open split bill](https://playground.noahyao.me/split-bill)\n")

          if over:
              lines = [f"{len(over)} person(s) owe more than ¥{threshold:,.0f}.", ""]
              for name, total, n, first in over:
                  lines.append(f"  {name}: ¥{total:,.2f} across {n} charge(s), oldest {first}")
              lines += ["", "https://playground.noahyao.me/split-bill"]
              open("alert.txt", "w").write("\n".join(lines))
          PY

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          set -euo pipefail
          title="Unpaid over threshold"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"

          if [ "$COUNT" = "0" ]; then
            # Nothing outstanding: close the thread rather than leaving a stale alert open.
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Everyone is back under the threshold."
            fi
            exit 0
          fi

          body="$(cat alert.txt)
          "
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Email the detail
        # Skipped silently when SMTP is not configured — the check above still ran.
        if: steps.check.outputs.count != '0' && env.SMTP_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ vars.SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Split Bill <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.ALERT_TO || secrets.SMTP_USERNAME }}
          subject: "Split bill: ${{ steps.check.outputs.count }} over the unpaid threshold"
          # file:// keeps the body out of the workflow definition and the log.
          body: file://alert.txt
