name: Supabase Keep-Alive

# Supabase pauses Free Plan projects after 7 days without database activity.
# This pings a real table through PostgREST (not just a health endpoint) so
# it counts as genuine "user database activity" and resets that timer.
# Docs: https://supabase.com/docs/guides/platform/free-project-pausing

on:
  schedule:
    # Daily. Off-the-hour dodges the busiest slots but does not avoid delay:
    # in practice GitHub has been running this about four hours late. Harmless
    # here, since only the 7-day inactivity window matters.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset inactivity timer
        run: |
          # 2026-09-13 this failed on a one-off 504 from Supabase and stayed
          # failed: one missed ping is fine, but a keep-alive that gives up on
          # a transient error is one you cannot read as a health signal.
          curl --fail -sS --retry 3 --retry-delay 10 --retry-all-errors \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/payment_methods?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
