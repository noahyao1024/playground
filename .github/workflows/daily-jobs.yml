name: Daily jobs

# The site's scheduled work, run from here so that every run is on record and
# a failed one reaches the owner: GitHub mails the owner when a scheduled run
# fails. Vercel Cron on the Hobby plan neither retries nor tells anyone, and
# keeps an hour of logs.
#
# The work itself happens on the site, in /api/cron/bill and /api/cron/daily,
# next to the configuration it needs. scripts/daily-jobs.mjs calls them and
# decides what counts as a failure; its tests say what that is. The site knows
# this workflow by its GitHub OIDC token, so no secret is copied here for that.
# The mail goes out from here, through the SMTP account GitHub holds.
#
# Vercel Cron still bills and keeps the database awake on its own (vercel.json),
# so if GitHub stops scheduling this -- it does, in a public repository, after
# 60 days without a commit, with an email a week before -- bills still go out
# and the site stays up. Only the unpaid alert waits.

on:
  schedule:
    # Off the hour, the busiest slot. GitHub starts scheduled runs late anyway,
    # about five hours here and up to twelve, which nothing in this minds.
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      test_mail:
        description: Test mail -- send the alert even if nobody is over the threshold
        type: boolean
        default: false

permissions:
  contents: read
  # The OIDC token the site checks in place of a shared secret.
  id-token: write

# A run started by hand waits for a scheduled one rather than overlapping it.
concurrency: daily-jobs

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bill on the 1st to 3rd, check who owes
        id: jobs
        run: node scripts/daily-jobs.mjs ${{ inputs.test_mail && '--test-mail' || '' }}
      - name: Mail the owner
        # Even if billing failed: the alert stands on its own.
        if: ${{ !cancelled() && steps.jobs.outputs.mail == 'true' }}
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ vars.SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          # Gmail sends only as an address verified under "Send mail as"; anything
          # else is rewritten to the account, so the account is the default.
          from: Split Bill <${{ vars.MAIL_FROM || secrets.SMTP_USERNAME }}>
          to: ${{ secrets.ALERT_TO || secrets.SMTP_USERNAME }}
          subject: ${{ steps.jobs.outputs.subject }}
          # file:// keeps the body, which names people, out of the log.
          body: file://${{ steps.jobs.outputs.mail_file }}
